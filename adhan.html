<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adhan Prayer Times</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #fff;
      margin-top: 60px;
      padding: 32px 24px;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
      max-width: 350px;
      width: 100%;
      text-align: center;
    }
    h1 {
      color: #2d7a5f;
      margin-bottom: 24px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }
    th, td {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    th {
      color: #2d7a5f;
      font-size: 1.1em;
    }
    tr:last-child td {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Adhan Prayer Times</h1>
    <table>
      <tr><th>Prayer</th><th>Time</th></tr>
      <tr><td>Fajr</td><td>05:00 AM</td></tr>
      <tr><td>Dhuhr</td><td>12:30 PM</td></tr>
      <tr><td>Asr</td><td>04:00 PM</td></tr>
      <tr><td>Maghrib</td><td>07:15 PM</td></tr>
      <tr><td>Isha</td><td>08:45 PM</td></tr>
    </table>
  </div>
</body>
</html>
